<div
  class="flex-1 flex items-center justify-center p-4 bg-grey-olive-50 min-h-screen"
>
  <div
    class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden animate-in fade-in zoom-in duration-300 border border-grey-olive-200"
  >
    <div
      class="p-6 border-b border-yellow-100 flex items-center justify-between bg-yellow-50/50"
    >
      <div class="flex items-center gap-3 text-yellow-700">
        <div class="p-2 bg-yellow-100 rounded-lg">
          <i class="ph-bold ph-door-open text-xl"></i>
        </div>
        <h2 class="text-xl font-bold">Apertura de Caja</h2>
      </div>
      <button
        (click)="goBack()"
        class="p-2 hover:bg-yellow-100 rounded-full text-yellow-700 transition-colors"
        title="Volver"
      >
        <i class="ph-bold ph-x text-lg"></i>
      </button>
    </div>

    <form (ngSubmit)="openCash()" class="p-6 space-y-5">
      <div
        class="bg-blue-50 border border-blue-100 p-4 rounded-xl flex gap-3 text-blue-800 text-sm"
      >
        <i class="ph-fill ph-info text-xl shrink-0"></i>
        <p>
          Ingresa el monto de efectivo con el que inicias el turno para llevar
          un control preciso.
        </p>
      </div>

      <div>
        <label
          class="block text-xs font-black text-pale-slate-500 uppercase tracking-widest mb-2"
          >Saldo Inicial en Caja</label
        >
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-pale-slate-400 font-bold text-lg group-focus-within:text-yellow-600 transition-colors"
            >$</span
          >
          <input
            type="number"
            name="initialBalance"
            [(ngModel)]="cashOpenData.initialBalance"
            placeholder="0.00"
            step="0.01"
            class="w-full pl-10 pr-4 py-4 rounded-xl border-2 border-grey-olive-100 focus:border-yellow-500 outline-none transition-all font-bold text-2xl text-pale-slate-800"
            required
            autofocus
          />
        </div>
      </div>

      <div>
        <label
          class="block text-xs font-black text-pale-slate-500 uppercase tracking-widest mb-2"
          >Notas de apertura (Opcional)</label
        >
        <textarea
          name="description"
          [(ngModel)]="cashOpenData.description"
          rows="2"
          placeholder="Ej: Inicio de semana, fondo de reserva incluido..."
          class="w-full px-4 py-3 rounded-xl border-2 border-grey-olive-100 focus:border-yellow-500 outline-none transition-all resize-none"
        ></textarea>
      </div>

      <div class="pt-4 flex flex-col gap-3">
        <button
          type="submit"
          class="w-full px-6 py-4 rounded-xl font-bold text-white bg-yellow-600 hover:bg-yellow-700 shadow-lg shadow-yellow-200 transition-all active:scale-[0.98] flex items-center justify-center gap-2"
        >
          <i class="ph-bold ph-check-circle text-xl"></i>
          CONFIRMAR APERTURA
        </button>
        <button
          type="button"
          (click)="goBack()"
          class="w-full px-6 py-3 rounded-xl font-bold text-pale-slate-500 hover:bg-grey-olive-100 transition-all"
        >
          Cancelar y volver
        </button>
      </div>
    </form>
  </div>
</div>
