<div
  class="flex flex-col h-full overflow-hidden relative bg-grey-olive-50 font-sans"
>
  <!-- Header Estándar -->
  <app-page-header title="Clientes"></app-page-header>

  <!-- Contenido Scrollable -->
  <div class="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-8 scroll-smooth">
    <!-- 2. SECCIÓN SUPERIOR: TARJETAS DE RESUMEN (KPIs) -->
    <app-customer-stats
      [totalCustomers]="totalCustomers()"
      [customersWithDebtCount]="customersWithDebtCount()"
      [customersAtLimitCount]="customersAtLimitCount()"
    />

    <!-- 3. BARRA DE ACCIONES (Filtros + Botón Nuevo) -->
    <app-customer-action-bar
      [(searchTerm)]="searchTerm"
      [(selectedStatus)]="selectedStatus"
      (onAddCustomer)="openNewCustomerModal()"
    />

    <!-- 4. LA TABLA PRINCIPAL -->
    <app-customer-table
      [customers]="filteredCustomers()"
      (onEdit)="openEditCustomerModal($event)"
      (onDelete)="deleteCustomer($event)"
      (onWhatsApp)="openWhatsApp($event)"
    />
  </div>
</div>

<!-- 5. MODAL INTERACTIVO: NUEVO / EDITAR CLIENTE -->
<app-customer-form-modal
  [isOpen]="isModalOpen()"
  [customer]="editingCustomer()"
  (onClose)="closeModal()"
  (onSave)="saveCustomer($event)"
/>
