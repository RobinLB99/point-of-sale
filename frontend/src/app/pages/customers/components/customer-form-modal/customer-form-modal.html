@if (isOpen()) {
<div
  class="fixed inset-0 z-100 flex items-center justify-center p-4 bg-pale-slate-950/60 backdrop-blur-sm transition-all duration-300"
>
  <div
    class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-200"
  >
    <!-- Cabecera -->
    <div
      class="px-8 py-6 border-b border-grey-olive-100 flex items-center justify-between bg-white"
    >
      <div>
        <h3 class="text-xl font-black text-pale-slate-900 leading-none mb-1">
          {{ customer() ? 'Actualizar Cliente' : 'Nuevo Cliente' }}
        </h3>
        <p class="text-xs text-grey-olive-400 font-medium">
          Gestión de crédito y datos personales
        </p>
      </div>
      <button
        (click)="onClose.emit()"
        class="w-10 h-10 flex items-center justify-center text-grey-olive-400 hover:text-pale-slate-900 hover:bg-grey-olive-50 rounded-full transition-all"
      >
        <i class="ph-bold ph-x text-2xl"></i>
      </button>
    </div>

    <!-- Cuerpo (Formulario) -->
    <form
      [formGroup]="customerForm"
      (ngSubmit)="submit()"
      class="p-8 space-y-6"
    >
      <div class="space-y-4">
        <div>
          <label
            class="block text-xs font-black text-pale-slate-500 uppercase tracking-widest mb-2"
          >
            Nombre / Alias (Obligatorio)
          </label>
          <input
            type="text"
            formControlName="name"
            placeholder="Ej. María Esquina, Don Pepe..."
            class="w-full px-4 py-3 bg-grey-olive-50 border border-grey-olive-200 rounded-xl focus:ring-2 focus:ring-soft-linen-500 focus:border-soft-linen-500 outline-none transition-all font-semibold"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              class="block text-xs font-black text-pale-slate-500 uppercase tracking-widest mb-2"
            >
              Teléfono (WhatsApp)
            </label>
            <input
              type="text"
              formControlName="phone"
              placeholder="09..."
              class="w-full px-4 py-3 bg-grey-olive-50 border border-grey-olive-200 rounded-xl focus:ring-2 focus:ring-soft-linen-500 focus:border-soft-linen-500 outline-none transition-all font-semibold"
            />
          </div>
          <div>
            <label
              class="block text-xs font-black text-pale-slate-500 uppercase tracking-widest mb-2"
            >
              Identificación (CI)
            </label>
            <input
              type="text"
              formControlName="cedula"
              placeholder="Opcional"
              class="w-full px-4 py-3 bg-grey-olive-50 border border-grey-olive-200 rounded-xl focus:ring-2 focus:ring-soft-linen-500 focus:border-soft-linen-500 outline-none transition-all font-semibold"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
          <div
            class="p-4 bg-pale-slate-50 rounded-2xl border border-pale-slate-100"
          >
            <label
              class="block text-[10px] font-black text-pale-slate-400 uppercase tracking-widest mb-2"
            >
              Límite de Crédito ($)
            </label>
            <input
              type="number"
              formControlName="creditLimit"
              class="w-full bg-transparent text-2xl font-black text-pale-slate-900 outline-none"
            />
          </div>
          <div class="p-4 bg-orange-50 rounded-2xl border border-orange-100">
            <label
              class="block text-[10px] font-black text-orange-400 uppercase tracking-widest mb-2"
            >
              Deuda Actual ($)
            </label>
            <input
              type="number"
              formControlName="currentDebt"
              class="w-full bg-transparent text-2xl font-black text-orange-600 outline-none"
            />
          </div>
        </div>
      </div>

      <!-- Pie del Modal -->
      <div
        class="pt-6 flex items-center justify-end gap-4 border-t border-grey-olive-100"
      >
        <button
          type="button"
          (click)="onClose.emit()"
          class="px-6 py-3 text-sm font-bold text-pale-slate-400 hover:text-pale-slate-600 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="customerForm.invalid"
          class="px-10 py-3 bg-soft-linen-600 text-white rounded-xl text-sm font-black uppercase tracking-widest hover:bg-soft-linen-700 transition-all shadow-lg shadow-soft-linen-500/20 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ customer() ? 'Actualizar Cliente' : 'Registrar Cliente' }}
        </button>
      </div>
    </form>
  </div>
</div>
}
