@if (!isOpen()) {
  <div
    class="mb-6 bg-yellow-50 border border-yellow-200 rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm animate-in fade-in slide-in-from-top-4 duration-300"
  >
    <div class="flex items-center gap-4 text-yellow-800">
      <div class="p-3 bg-yellow-100 rounded-xl">
        <i class="ph-bold ph-warning-circle text-2xl"></i>
      </div>
      <div>
        <h3 class="font-bold text-lg">La caja está cerrada</h3>
        <p class="text-sm opacity-90">
          Debes abrir la caja para poder registrar ventas y movimientos.
        </p>
      </div>
    </div>
    <a
      [routerLink]="['/open-cash']"
      [queryParams]="{ returnUrl: router.url }"
      class="w-full sm:w-auto px-6 py-3 bg-yellow-600 hover:bg-yellow-700 text-white font-bold rounded-xl transition-all shadow-md shadow-yellow-200 flex items-center justify-center gap-2 active:scale-95"
    >
      <i class="ph-bold ph-door-open"></i>
      ABRIR CAJA AHORA
    </a>
  </div>
}
