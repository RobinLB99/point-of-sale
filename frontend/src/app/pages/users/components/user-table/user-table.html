<div
  class="bg-white rounded-xl shadow-sm border border-grey-olive-200 overflow-hidden"
>
  <div
    class="px-6 py-4 border-b border-grey-olive-100 flex items-center justify-between"
  >
    <h3 class="font-bold text-pale-slate-800">Directorio de Usuarios</h3>
  </div>
  <div class="overflow-x-auto custom-scrollbar">
    <table class="w-full text-left min-w-200">
      <thead
        class="bg-grey-olive-50 text-grey-olive-500 text-[10px] font-black uppercase tracking-[0.15em]"
      >
        <tr>
          <th class="px-6 py-4">Usuario</th>
          <th class="px-6 py-4">Rol</th>
          <th class="px-6 py-4 text-center">Estado</th>
          <th class="px-6 py-4">Registro</th>
          <th class="px-6 py-4 text-right">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-grey-olive-100">
        <tr
          *ngFor="let user of users()"
          class="hover:bg-grey-olive-50/50 transition-colors group"
        >
          <td class="px-6 py-5">
            <div class="flex items-center gap-3">
              <div
                class="w-10 h-10 rounded-full bg-pale-slate-100 text-pale-slate-600 flex items-center justify-center font-bold text-base border border-pale-slate-200"
              >
                {{ user.name.charAt(0) }}
              </div>
              <div>
                <div class="font-bold text-pale-slate-900 text-base">
                  {{ user.name }}
                </div>
                <div class="text-sm text-grey-olive-500 font-medium">
                  @{{ user.username }}
                </div>
              </div>
            </div>
          </td>
          <td class="px-6 py-5">
            <span
              class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider border"
              [ngClass]="{
                'bg-purple-100 text-purple-700 border-purple-200': user.role === 'admin',
                'bg-blue-100 text-blue-700 border-blue-200': user.role === 'manager',
                'bg-orange-100 text-orange-700 border-orange-200': user.role === 'cashier'
              }"
            >
              {{ user.role }}
            </span>
          </td>
          <td class="px-6 py-5 text-center">
            <span
              class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter"
              [ngClass]="user.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-grey-olive-100 text-grey-olive-500'"
            >
              {{ user.status === 'active' ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="px-6 py-5 text-sm text-grey-olive-500 font-medium">
            {{ user.createdAt | date:'dd/MM/yyyy' }}
          </td>
          <td class="px-6 py-5 text-right">
            <div class="flex justify-end gap-1">
              <button
                (click)="onEdit.emit(user)"
                class="p-2 text-pale-slate-400 hover:text-soft-linen-600 hover:bg-soft-linen-50 rounded-lg transition-all"
                title="Editar"
              >
                <i class="ph-bold ph-pencil-simple text-lg"></i>
              </button>
              <button
                (click)="onDelete.emit(user.id)"
                class="p-2 text-pale-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"
                title="Eliminar"
              >
                <i class="ph-bold ph-trash text-lg"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="users().length === 0" class="p-16 text-center">
    <div
      class="w-16 h-16 bg-grey-olive-100 rounded-full flex items-center justify-center mx-auto mb-4 text-grey-olive-300"
    >
      <i class="ph ph-users-three text-4xl"></i>
    </div>
    <p class="text-grey-olive-500 font-medium italic">
      No se encontraron usuarios con esos filtros.
    </p>
  </div>
</div>
