# =============================================================
# CONFIGURACION DE DESARROLLO (dev)
# =============================================================

# Datasource: PostgreSQL (Sincronizado con .env)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-drop.sql,classpath:schema.sql
spring.sql.init.data-locations=classpath:data-dev.sql

# Redis (Sincronizado con .env)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Logging
logging.level.com.robinlugoboero.possystemapi=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging
logging.level.com.robinlugoboero.possystemapi=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
