<!-- Mobile Overlay -->
<div
  (click)="toggleSidebar()"
  class="fixed inset-0 bg-pale-slate-950/60 backdrop-blur-sm z-60 lg:hidden transition-all duration-300"
  [class.opacity-0]="!isOpen()"
  [class.pointer-events-none]="!isOpen()"
  [class.hidden]="!isOpen()"
></div>

<aside
  id="sidebar"
  class="fixed inset-y-0 left-0 z-70 w-72 bg-pale-slate-900 text-pale-slate-400 flex flex-col shadow-2xl lg:static lg:translate-x-0 font-sans border-r border-pale-slate-800 transition-transform duration-300"
  [class.-translate-x-full]="!isOpen()"
>
  <!-- Header -->
  <div
    class="h-auto py-6 flex flex-col px-6 bg-pale-slate-950 border-b border-pale-slate-800 gap-4"
  >
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-linear-to-br from-soft-linen-500 to-soft-linen-700 flex items-center justify-center text-white shadow-lg shadow-soft-linen-900/20"
        >
          <i class="ph-bold ph-storefront text-xl"></i>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-lg text-white leading-tight tracking-wide"
            >Mi Tienda</span
          >
          <span
            class="text-[10px] font-medium text-soft-linen-500 uppercase tracking-widest"
            >POS System</span
          >
        </div>
      </div>
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-pale-slate-500 hover:text-white p-2 rounded-md hover:bg-pale-slate-800 transition-colors"
        aria-label="Cerrar menú"
      >
        <i class="ph-bold ph-x text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-8 overflow-y-auto custom-scrollbar">
    <div>
      <h3
        class="px-4 text-xs font-bold text-pale-slate-600 uppercase tracking-widest mb-3"
      >
        Operación
      </h3>
      <div class="space-y-1">
        <a
          (click)="navigateTo('/dashboard', $event)"
          routerLink="/dashboard"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
          role="button"
        >
          <i class="ph-bold ph-squares-four text-lg mr-3"></i>
          <span class="font-semibold text-sm">Dashboard</span>
        </a>

        <a
          (click)="navigateTo('/pos', $event)"
          routerLink="/pos"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
          role="button"
        >
          <i class="ph-bold ph-shopping-cart text-lg mr-3"></i>
          <span class="font-semibold text-sm">Punto de Venta</span>
        </a>

        <a
          (click)="navigateTo('/movements', $event)"
          routerLink="/movements"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
          role="button"
        >
          <i class="ph-bold ph-cash-register text-lg mr-3"></i>
          <span class="font-semibold text-sm">Caja & Movimientos</span>
        </a>

        <a
          (click)="navigateTo('/credits', $event)"
          routerLink="/credits"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
          role="button"
        >
          <div class="mr-3 relative">
            <i class="ph-bold ph-notebook text-lg"></i>
            <span
              class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 bg-yellow-500 rounded-full"
            ></span>
          </div>
          <span class="font-semibold text-sm">Crédito</span>
        </a>
      </div>
    </div>

    <div>
      <h3
        class="px-4 text-xs font-bold text-pale-slate-600 uppercase tracking-widest mb-3"
      >
        Inventario
      </h3>
      <div class="space-y-1">
        <a
          (click)="navigateTo('/products', $event)"
          routerLink="/products"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
          role="button"
        >
          <i class="ph-bold ph-package text-lg mr-3"></i>
          <span class="font-semibold text-sm">Productos</span>
        </a>
        <a
          (click)="navigateTo('/suppliers', $event)"
          routerLink="/suppliers"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
          role="button"
        >
          <i class="ph-bold ph-truck text-lg mr-3"></i>
          <span class="font-semibold text-sm">Proveedores</span>
        </a>
      </div>
    </div>

    <div>
      <h3
        class="px-4 text-xs font-bold text-pale-slate-600 uppercase tracking-widest mb-3"
      >
        Admin
      </h3>
      <div class="space-y-1">
        <a
          (click)="navigateTo('/customers', $event)"
          routerLink="/customers"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
          role="button"
        >
          <i class="ph-bold ph-users text-lg mr-3"></i>
          <span class="font-semibold text-sm">Clientes</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- User Section -->
  <div
    #userMenuContainer
    class="p-4 bg-pale-slate-950 border-t border-pale-slate-800 relative"
  >
    <!-- Perfil Popover (Se despliega hacia arriba) -->
    @if (isUserMenuOpen()) {
    <div
      class="absolute bottom-full left-4 right-4 mb-2 bg-pale-slate-900 border border-pale-slate-800 rounded-2xl shadow-2xl overflow-hidden z-80 animate-in fade-in slide-in-from-bottom-4 duration-200"
    >
      <!-- User Info Header -->
      <div
        class="p-5 bg-pale-slate-950/50 border-b border-pale-slate-800 flex flex-col items-center text-center gap-3"
      >
        <div
          class="w-16 h-16 rounded-full bg-soft-linen-600 flex items-center justify-center text-xl font-bold text-white shadow-xl shadow-soft-linen-900/20 border-2 border-pale-slate-800"
        >
          {{ currentUser.initials }}
        </div>
        <div class="space-y-0.5">
          <p class="font-bold text-white">{{ currentUser.name }}</p>
          <p class="text-xs text-pale-slate-500">{{ currentUser.email }}</p>
        </div>
        <div
          class="px-3 py-1 bg-soft-linen-600/10 text-soft-linen-500 rounded-full text-[10px] font-black uppercase tracking-widest border border-soft-linen-600/20"
        >
          {{ currentUser.role }}
        </div>
      </div>

      <!-- Actions List -->
      <div class="p-2 space-y-1">
        <button
          (click)="navigateTo('/settings')"
          class="flex items-center gap-3 w-full p-3 rounded-xl text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 transition-all group"
        >
          <div
            class="w-8 h-8 rounded-lg bg-pale-slate-800 flex items-center justify-center group-hover:bg-soft-linen-600/20 group-hover:text-soft-linen-500 transition-colors"
          >
            <i class="ph-bold ph-gear-six"></i>
          </div>
          <span class="text-sm font-semibold">Configuración</span>
        </button>

        <button
          (click)="navigateTo('/users')"
          class="flex items-center gap-3 w-full p-3 rounded-xl text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 transition-all group"
        >
          <div
            class="w-8 h-8 rounded-lg bg-pale-slate-800 flex items-center justify-center group-hover:bg-soft-linen-600/20 group-hover:text-soft-linen-500 transition-colors"
          >
            <i class="ph-bold ph-users-four"></i>
          </div>
          <span class="text-sm font-semibold">Usuarios</span>
        </button>
      </div>

      <!-- Logout Footer -->
      <div class="p-2 border-t border-pale-slate-800 bg-pale-slate-950/30">
        <button
          (click)="logout()"
          class="flex items-center gap-3 w-full p-3 rounded-xl text-rose-400 hover:text-white hover:bg-rose-500/10 transition-all group"
        >
          <div
            class="w-8 h-8 rounded-lg bg-rose-500/10 flex items-center justify-center group-hover:bg-rose-500/20 transition-colors text-rose-500 group-hover:text-rose-400"
          >
            <i class="ph-bold ph-sign-out"></i>
          </div>
          <span class="text-sm font-bold uppercase tracking-wider"
            >Cerrar Sesión</span
          >
        </button>
      </div>
    </div>
    }

    <!-- Botón de Perfil Principal -->
    <button
      (click)="toggleUserMenu($event)"
      class="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-pale-slate-800 transition-colors border border-transparent group"
      [class.bg-pale-slate-800]="isUserMenuOpen()"
    >
      <div class="relative">
        <div
          class="w-10 h-10 rounded-full bg-pale-slate-700 flex items-center justify-center text-xs font-bold text-white border-2 border-pale-slate-900 group-hover:border-pale-slate-800 transition-all shadow-sm"
          [class.border-soft-linen-600]="isUserMenuOpen()"
        >
          {{ currentUser.initials }}
        </div>
        <span
          class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-pale-slate-900 group-hover:border-pale-slate-800 rounded-full"
        ></span>
      </div>
      <div class="flex-1 min-w-0 text-left">
        <p class="font-semibold text-sm text-white truncate">
          {{ currentUser.name }}
        </p>
        <p class="text-[11px] text-pale-slate-500 truncate">
          {{ currentUser.role }}
        </p>
      </div>
      <i
        class="ph-bold ph-caret-up text-pale-slate-600 group-hover:text-pale-slate-400 transition-transform duration-300"
        [class.rotate-180]="isUserMenuOpen()"
      ></i>
    </button>
  </div>
</aside>
