<!-- Mobile Overlay -->
<div
  (click)="toggleSidebar()"
  class="fixed inset-0 bg-pale-slate-950/60 backdrop-blur-sm z-[60] lg:hidden transition-all duration-300"
  [class.opacity-0]="!isOpen()"
  [class.pointer-events-none]="!isOpen()"
  [class.hidden]="!isOpen()"
></div>

<aside
  id="sidebar"
  class="fixed inset-y-0 left-0 z-[70] w-72 bg-pale-slate-900 text-pale-slate-400 flex flex-col shadow-2xl lg:static lg:translate-x-0 font-sans border-r border-pale-slate-800 transition-transform duration-300"
  [class.-translate-x-full]="!isOpen()"
>
  <!-- Header -->
  <div
    class="h-auto py-6 flex flex-col px-6 bg-pale-slate-950 border-b border-pale-slate-800 gap-4"
  >
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-soft-linen-500 to-soft-linen-700 flex items-center justify-center text-white shadow-lg shadow-soft-linen-900/20"
        >
          <i class="ph-bold ph-storefront text-xl"></i>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-lg text-white leading-tight tracking-wide"
            >Mi Tienda</span
          >
          <span
            class="text-[10px] font-medium text-soft-linen-500 uppercase tracking-widest"
            >POS System</span
          >
        </div>
      </div>
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-pale-slate-500 hover:text-white p-2 rounded-md hover:bg-pale-slate-800 transition-colors"
        aria-label="Cerrar menú"
      >
        <i class="ph-bold ph-x text-xl"></i>
      </button>
    </div>

    <!-- Cash Status Label -->
    <div class="flex items-center">
      @if (cashControlService.isCashOpen()) {
      <div
        class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest bg-green-500/10 text-green-400 border border-green-500/20 w-full justify-center"
      >
        <span
          class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"
        ></span>
        Caja Abierta
      </div>
      } @else {
      <div
        class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest bg-red-500/10 text-red-400 border border-red-500/20 w-full justify-center"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
        Caja Cerrada
      </div>
      }
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-8 overflow-y-auto custom-scrollbar">
    <div>
      <h3
        class="px-4 text-xs font-bold text-pale-slate-600 uppercase tracking-widest mb-3"
      >
        Operación
      </h3>
      <div class="space-y-1">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <i class="ph-bold ph-squares-four text-lg mr-3"></i>
          <span class="font-semibold text-sm">Dashboard</span>
        </a>

        <a
          routerLink="/pos"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <i class="ph-bold ph-shopping-cart text-lg mr-3"></i>
          <span class="font-semibold text-sm">Punto de Venta</span>
        </a>

        <a
          routerLink="/movements"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <i class="ph-bold ph-cash-register text-lg mr-3"></i>
          <span class="font-semibold text-sm">Caja & Movimientos</span>
        </a>

        <a
          routerLink="/credits"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <div class="mr-3 relative">
            <i class="ph-bold ph-notebook text-lg"></i>
            <span
              class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 bg-yellow-500 rounded-full"
            ></span>
          </div>
          <span class="font-semibold text-sm">Crédito</span>
        </a>
      </div>
    </div>

    <div>
      <h3
        class="px-4 text-xs font-bold text-pale-slate-600 uppercase tracking-widest mb-3"
      >
        Inventario
      </h3>
      <div class="space-y-1">
        <a
          routerLink="/products"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <i class="ph-bold ph-package text-lg mr-3"></i>
          <span class="font-semibold text-sm">Productos</span>
        </a>
        <a
          routerLink="/suppliers"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <i class="ph-bold ph-truck text-lg mr-3"></i>
          <span class="font-semibold text-sm">Proveedores</span>
        </a>
      </div>
    </div>

    <div>
      <h3
        class="px-4 text-xs font-bold text-pale-slate-600 uppercase tracking-widest mb-3"
      >
        Admin
      </h3>
      <div class="space-y-1">
        <a
          routerLink="/customers"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <i class="ph-bold ph-users text-lg mr-3"></i>
          <span class="font-semibold text-sm">Clientes</span>
        </a>
        <a
          routerLink="/settings"
          routerLinkActive="bg-soft-linen-600 text-white !shadow-soft-linen-900/10"
          class="flex items-center px-4 py-3 text-pale-slate-400 hover:text-white hover:bg-pale-slate-800 rounded-xl transition-all duration-200"
        >
          <i class="ph-bold ph-gear text-lg mr-3"></i>
          <span class="font-semibold text-sm">Configuración</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- User Section -->
  <div class="p-4 bg-pale-slate-950 border-t border-pale-slate-800">
    <button
      class="flex items-center gap-3 w-full p-3 rounded-xl hover:bg-pale-slate-800 transition-colors border border-transparent group"
    >
      <div class="relative">
        <div
          class="w-10 h-10 rounded-full bg-pale-slate-700 flex items-center justify-center text-xs font-bold text-white border-2 border-pale-slate-900 group-hover:border-pale-slate-800 transition-all"
        >
          JD
        </div>
        <span
          class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-pale-slate-900 group-hover:border-pale-slate-800 rounded-full"
        ></span>
      </div>
      <div class="flex-1 min-w-0 text-left">
        <p class="font-semibold text-sm text-white truncate">Juan Dueño</p>
        <p class="text-[11px] text-pale-slate-500 truncate">Administrador</p>
      </div>
      <i
        class="ph-bold ph-caret-up text-pale-slate-600 group-hover:text-pale-slate-400 transition-colors"
      ></i>
    </button>
  </div>
</aside>
