<div class="flex flex-col h-full overflow-hidden relative bg-gray-olive-50">
  <!-- Header Estándar -->
  <header
    class="h-16 bg-white border-b border-grey-olive-200 flex items-center justify-between px-4 lg:px-8 shadow-sm relative z-10 shrink-0"
  >
    <div class="flex items-center gap-3">
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-pale-slate-700 p-2 -ml-2 rounded-md hover:bg-grey-olive-100 focus:outline-none"
      >
        <i class="ph ph-list text-2xl"></i>
      </button>

      <h1 class="text-lg lg:text-xl font-bold text-pale-slate-900 ml-2 lg:ml-0">
        Productos
      </h1>
    </div>
  </header>

  <!-- Contenido Scrollable -->
  <div class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth">
    <!-- 1. SECCIÓN SUPERIOR: TARJETAS DE RESUMEN (KPIs) -->
    <app-product-stats></app-product-stats>

    <!-- 2. SECCIÓN MEDIA: BARRA DE ACCIONES (Búsqueda, Filtros y Nuevo) -->
    <app-product-action-bar
      [searchTerm]="searchTerm()"
      [selectedCategory]="selectedCategory()"
      (onSearchChange)="searchTerm.set($event)"
      (onCategoryChange)="selectedCategory.set($event)"
      (onNewProduct)="openNewProductModal()"
    ></app-product-action-bar>

    <!-- 3. SECCIÓN INFERIOR: TABLA DE DATOS -->
    <app-product-table
      [products]="filteredProducts()"
      (onEdit)="openEditProductModal($event)"
      (onDelete)="deleteProduct($event)"
      (onRestock)="openRestockModal($event)"
    ></app-product-table>
  </div>
</div>

<!-- 4. MODALES -->
@if (isModalOpen()) {
<app-product-form-modal
  [editingProduct]="editingProduct()"
  (onClose)="closeModal()"
  (onSave)="handleSaveProduct($event)"
></app-product-form-modal>
}

@if (isRestockModalOpen()) {
<app-product-restock-modal
  [product]="productToRestock()"
  (onClose)="closeModal()"
  (onSave)="handleSaveRestock($event)"
></app-product-restock-modal>
}
