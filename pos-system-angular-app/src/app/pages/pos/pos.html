<div class="flex flex-col h-full overflow-hidden relative">
  <!-- Header Minimalista -->
  <header
    class="h-16 bg-white border-b border-grey-olive-200 flex items-center justify-between px-4 shadow-sm z-10 flex-shrink-0"
  >
    <div class="flex items-center gap-3">
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-pale-slate-700 p-2 -ml-2 rounded-md hover:bg-grey-olive-100"
      >
        <i class="ph ph-list text-2xl"></i>
      </button>
      <h1 class="font-bold text-pale-slate-900 text-lg leading-tight">
        Venta
        <span class="hidden sm:inline text-grey-olive-400 font-normal"
          >/ Caja 1</span
        >
      </h1>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden relative">
    <!-- Product Grid Area -->
    <div class="flex-1 overflow-y-auto custom-scrollbar bg-grey-olive-50">
      <div class="p-4 pb-32 lg:pb-8 max-w-7xl mx-auto">
        <!-- 1. Alerta de Caja -->
        <app-cash-status-banner
          [isOpen]="isCashOpen()"
        ></app-cash-status-banner>

        <!-- 2. Barra de Acciones (Buscador, Categorías, Limpiar) -->
        <app-pos-action-bar
          [searchQuery]="searchQuery()"
          [selectedCategory]="selectedCategory()"
          [categories]="categories()"
          [isCashOpen]="isCashOpen()"
          (onSearchChange)="searchQuery.set($event)"
          (onCategoryChange)="selectedCategory.set($event)"
          (onClearCart)="clearCart()"
        ></app-pos-action-bar>

        <!-- 3. Rejilla de Productos -->
        <app-product-grid
          [products]="filteredProducts()"
          [isCashOpen]="isCashOpen()"
          (onAddToCart)="addToCart($event)"
        ></app-product-grid>
      </div>
    </div>

    <!-- Desktop Cart Sidebar -->
    <app-desktop-cart
      class="hidden lg:flex w-96"
      (checkout)="procesarVenta()"
    ></app-desktop-cart>
  </div>

  <!-- Mobile Cart Components -->
  <app-mobile-cart
    [isOpen]="isCartMobileOpen()"
    (toggle)="toggleCartMobile()"
    (checkout)="procesarVenta()"
  ></app-mobile-cart>
</div>
