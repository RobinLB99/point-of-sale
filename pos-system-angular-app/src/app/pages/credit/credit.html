<header
  class="h-16 bg-white border-b border-grey-olive-200 flex items-center justify-between px-4 lg:px-8 shadow-sm relative z-10 flex-shrink-0"
>
  <div class="flex items-center gap-3">
    <button
      (click)="toggleSidebar()"
      class="lg:hidden text-pale-slate-700 p-2 -ml-2 rounded-md hover:bg-grey-olive-100 focus:outline-none"
    >
      <i class="ph ph-list text-2xl"></i>
    </button>
    <h1 class="text-lg lg:text-xl font-bold text-pale-slate-900 ml-2 lg:ml-0">
      Crédito (El Fiao)
    </h1>
  </div>
</header>

<div class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth bg-grey-olive-50">
  <!-- Cash Closed Warning -->
  @if (!cashControlService.isCashOpen()) {
  <div
    class="mb-6 bg-yellow-50 border border-yellow-200 rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm animate-in fade-in slide-in-from-top-4 duration-300"
  >
    <div class="flex items-center gap-4 text-yellow-800">
      <div class="p-3 bg-yellow-100 rounded-xl">
        <i class="ph-bold ph-warning-circle text-2xl"></i>
      </div>
      <div>
        <h3 class="font-bold text-lg">La caja está cerrada</h3>
        <p class="text-sm opacity-90">
          Debes abrir la caja para poder registrar abonos de crédito.
        </p>
      </div>
    </div>
    <a
      [routerLink]="['/open-cash']"
      [queryParams]="{ returnUrl: router.url }"
      class="w-full sm:w-auto px-6 py-3 bg-yellow-600 hover:bg-yellow-700 text-white font-bold rounded-xl transition-all shadow-md shadow-yellow-200 flex items-center justify-center gap-2 active:scale-95"
    >
      <i class="ph-bold ph-door-open"></i>
      ABRIR CAJA AHORA
    </a>
  </div>
  }

  <!-- 1. SECCIÓN SUPERIOR: TARJETAS DE RESUMEN (KPIs) -->
  <app-credit-stats></app-credit-stats>

  <!-- 2. SECCIÓN MEDIA: BARRA DE ACCIONES (Búsqueda y Nuevo Cliente) -->
  <app-credit-action-bar
    [searchTerm]="searchTerm()"
    (onSearchChange)="handleSearch($event)"
    (onNewClient)="handleNewClient()"
  ></app-credit-action-bar>

  <!-- 3. SECCIÓN INFERIOR: CONTENIDO PRINCIPAL -->
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Tabla de Deudores -->
    <app-debtor-table
      class="flex-1 flex flex-col"
      [debtors]="filteredDebtors()"
      [selectedId]="selectedDebtor()?.id"
      (onSelect)="selectDebtor($event)"
    ></app-debtor-table>

    <!-- Panel del Cliente -->
    <app-client-panel
      [debtor]="selectedDebtor()"
      [cashOpen]="cashControlService.isCashOpen()"
      (onOpenAbono)="openAbonoModal()"
    ></app-client-panel>
  </div>
</div>

<!-- 4. MODALES -->
<app-abono-modal
  *ngIf="showAbonoModal()"
  [debtor]="selectedDebtor()"
  (onClose)="closeAbonoModal()"
  (onSave)="registerAbono($event)"
></app-abono-modal>
