<div
  class="bg-white rounded-xl p-4 border border-grey-olive-200 shadow-sm mb-8 flex flex-col md:flex-row gap-4 items-center"
>
  <div class="flex-1 relative w-full group">
    <i
      class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-pale-slate-400 group-focus-within:text-soft-linen-500"
    ></i>
    <input
      type="text"
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearchChange.emit($event)"
      placeholder="Buscar cliente por nombre o teléfono..."
      class="w-full pl-11 pr-4 py-3 bg-grey-olive-50 border border-grey-olive-100 rounded-xl focus:outline-none focus:border-soft-linen-500 focus:bg-white transition-all text-sm"
    />
  </div>

  <button
    (click)="onNewClient.emit()"
    class="w-full md:w-auto bg-pale-slate-900 hover:bg-pale-slate-800 text-white px-6 py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-sm active:scale-95 whitespace-nowrap"
  >
    <i class="ph-bold ph-user-plus text-lg"></i>
    <span>Nuevo Cliente</span>
  </button>
</div>
