<header
  class="h-16 bg-white border-b border-grey-olive-200 flex items-center justify-between px-4 lg:px-8 shadow-sm relative z-10 shrink-0"
>
  <button
    (click)="toggleSidebar()"
    class="lg:hidden text-pale-slate-700 p-2 -ml-2 rounded-md hover:bg-grey-olive-100 focus:outline-none"
  >
    <i class="ph ph-list text-2xl"></i>
  </button>

  <h1 class="text-lg lg:text-xl font-bold text-pale-slate-900 ml-2 lg:ml-0">
    Caja & Movimientos
  </h1>

  <div class="flex items-center gap-3"></div>
</header>

<div class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth bg-grey-olive-50">
  <!-- 1. Panel Superior (Resumen) -->
  <app-cash-stats
    [initialBalance]="cashStatus().initialBalance"
    [openedAt]="cashStatus().openedAt"
    [cashSales]="cashStatus().cashSales"
    [expenses]="cashStatus().expenses"
    [expectedTotal]="cashStatus().expectedTotal"
  />

  <!-- 2. Botones de Acción -->
  <app-cash-action-bar
    [isCashOpen]="isCashOpen()"
    [currentUrl]="router.url"
    (onCloseCash)="closeCashRegister()"
  />

  <!-- 3. Tabla Inferior -->
  <app-cash-movement-table
    [movements]="movements()"
    (onExport)="exportMovements()"
  />

  <router-outlet></router-outlet>
</div>
