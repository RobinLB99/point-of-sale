<div
  class="flex flex-col h-full overflow-hidden relative bg-grey-olive-50 font-sans"
>
  <!-- Header Estándar -->
  <header
    class="h-16 bg-white border-b border-grey-olive-200 flex items-center justify-between px-4 lg:px-8 shadow-sm relative z-10 shrink-0"
  >
    <div class="flex items-center gap-3">
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-pale-slate-700 p-2 -ml-2 rounded-md hover:bg-grey-olive-100 focus:outline-none"
      >
        <i class="ph ph-list text-2xl"></i>
      </button>
      <h1 class="text-lg lg:text-xl font-bold text-pale-slate-900 ml-2 lg:ml-0">
        Proveedores
      </h1>
    </div>
  </header>

  <!-- Contenido Scrollable -->
  <div class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth">
    <!-- 1. SECCIÓN SUPERIOR: TARJETAS DE RESUMEN (KPIs) -->
    <app-supplier-stats
      [totalSuppliers]="totalSuppliers()"
      [visitsTodayCount]="visitsTodayCount()"
      [activeSuppliers]="activeSuppliers()"
    />

    <!-- 2. SECCIÓN MEDIA: BARRA DE ACCIONES -->
    <app-supplier-action-bar
      [(searchTerm)]="searchTerm"
      [(selectedDay)]="selectedDay"
      [daysOfWeek]="daysOfWeek"
      (onAddSupplier)="openNewSupplierModal()"
    />

    <!-- 3. SECCIÓN INFERIOR: TABLA DE DATOS -->
    <app-supplier-table
      [suppliers]="filteredSuppliers()"
      (onEdit)="openEditSupplierModal($event)"
      (onDelete)="deleteSupplier($event)"
      (onWhatsApp)="openWhatsApp($event)"
    />
  </div>
</div>

<!-- 4. MODAL INTERACTIVO: NUEVO / EDITAR PROVEEDOR -->
<app-supplier-form-modal
  [isOpen]="isModalOpen()"
  [supplier]="editingSupplier()"
  [daysOfWeek]="daysOfWeek"
  (onClose)="closeModal()"
  (onSave)="saveSupplier($event)"
/>
